name: Verificar conexão (não publica)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir chave e conta do Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/verificar.py
