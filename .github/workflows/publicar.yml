name: Publicar no Instagram

on:
  schedule:
    # Horário de Brasília (UTC−3): 08h, 10h, 13h, 16h e 19h, todos os dias.
    # Minuto 3 para fugir do pico do agendador do GitHub no minuto 0.
    - cron: "3 11 * * *"
    - cron: "3 13 * * *"
    - cron: "3 16 * * *"
    - cron: "3 19 * * *"
    - cron: "3 22 * * *"
  workflow_dispatch:
    inputs:
      horario:
        description: "Forçar horário (0800, 1000, 1300, 1600 ou 1900). Vazio = horário atual."
        required: false
      dia:
        description: "Forçar dia (AAAA-MM-DD). Vazio = hoje."
        required: false

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publicar a peça do horário
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          HORARIO_FORCADO: ${{ github.event.inputs.horario }}
          DIA_FORCADO: ${{ github.event.inputs.dia }}
        run: python3 scripts/publicar.py
      - name: Atualizar métricas
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/metricas.py || true
      - name: Salvar registro e métricas
        if: always()
        run: |
          git config user.name "anota-juros-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registro dados
          git diff --cached --quiet || git commit -m "Registro de publicação $(date -u +%FT%TZ)"
          git pull --rebase --autostash -q origin main || true
          git push -q || true
