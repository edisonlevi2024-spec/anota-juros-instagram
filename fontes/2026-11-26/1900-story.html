<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../modelos/base.css"><style>
body{--w:1080px;--h:1920px}
.wrap{position:absolute;inset:0;padding:260px 90px 0 170px}
h1{font-size:100px;line-height:1;font-weight:900;letter-spacing:-2px}
.passos{margin-top:130px;display:grid;gap:80px}
.p{display:flex;gap:34px;align-items:flex-start}
.n{flex:none;width:130px;height:130px;border-radius:30px;background:linear-gradient(180deg,#FFE08A,#F2C14E 50%,#C9971C);color:#1a1200;font-size:64px;font-weight:900;display:grid;place-items:center}
.p strong{display:block;font-size:60px;font-weight:900;line-height:1.05}
.p span{display:block;margin-top:10px;font-size:40px;color:#cfcabd;font-weight:600;line-height:1.25}
.bio{position:absolute;left:170px;right:90px;top:1500px;text-align:center;font-size:46px;font-weight:800}
.bio em{font-style:normal;color:var(--verde)}
</style></head><body>
<div class="pauta"></div><div class="margem"></div>
<div class="wrap">
<h1>Comece em<br><span class="ouro">3 passos</span></h1>
<div class="passos">
<div class="p"><div class="n">1</div><div><strong>Cadastre o cliente</strong><span>Nome e WhatsApp, em segundos.</span></div></div>
<div class="p"><div class="n">2</div><div><strong>Registre o empréstimo</strong><span>Valor, juros e vencimento. O sistema calcula.</span></div></div>
<div class="p"><div class="n">3</div><div><strong>Cobre pelo WhatsApp</strong><span>Mensagem pronta, é só revisar e enviar.</span></div></div>
</div>
</div>
<div class="bio"><em>7 dias grátis</em> · Link na bio 👆</div>
<div class="aviso">Não fazemos empréstimos. Somos um sistema de gestão.</div>
</body></html>
