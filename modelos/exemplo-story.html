<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{--w:1080px;--h:1920px}
.wrap{position:absolute;inset:0;padding:180px 90px 0 170px}
.logo{width:330px;margin-bottom:60px}
h1{font-size:96px;line-height:1;font-weight:900;letter-spacing:-2px}
.precos{margin-top:80px;display:grid;gap:34px}
.p{border:3px solid rgba(242,193,78,.55);border-radius:34px;padding:34px 40px;background:rgba(242,193,78,.06)}
.p small{display:block;font-size:34px;color:var(--cinza);font-weight:600}
.p strong{font-size:92px;font-weight:900;line-height:1.05}
.p.gratis{border-color:var(--verde);background:rgba(37,211,102,.08)}
.p.gratis strong{color:var(--verde)}
.bio{position:absolute;left:170px;right:90px;top:1610px;text-align:center;font-size:44px;font-weight:800}
.bio span{display:block;font-size:92px;line-height:1}
</style></head><body>
<div class="pauta"></div><div class="margem"></div>
<div class="wrap">
<img class="logo" src="anota-juros-logo.png">
<h1>Organize seus<br>empréstimos<br>pagando <span class="ouro">pouco</span></h1>
<div class="precos">
<div class="p gratis"><small>Para começar</small><strong>7 dias grátis</strong></div>
<div class="p"><small>Primeiro mês</small><strong class="ouro">R$ 9,90</strong></div>
<div class="p"><small>Do 2º ao 12º mês</small><strong>R$ 19,90<span style="font-size:44px;color:var(--cinza)">/mês</span></strong></div>
</div>
</div>
<div class="bio">Link na bio<span>👆</span></div>
<div class="aviso">Não fazemos empréstimos. Somos um sistema de gestão.</div>
</body></html>
